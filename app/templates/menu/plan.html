<div
    class="flex flex-wrap items-center gap-2"
    hx-post="{{ url_for('player_plan', code=game.code, color=player.color.key) }}?partial=true"
    hx-trigger="{% if game.choosing %}every 5s{% endif %}"
    hx-target="#board"
    hx-indicator="#spinner">
    {% if game.shared %}
    {% from "icons.html" import swap %}
    <a
        class="gc-btn-ghost"
        id="switch"
        href="{{ url_for('choose', code=game.code) }}">
        {{ swap() }}
        <span class="hidden md:inline">Switch Player</span>
    </a>
    {% endif %}
    <button
        type="button"
        class="gc-btn-primary shrink-0 whitespace-nowrap {% if game.shared and game.choosing %} disabled {% endif %}"
        id="plan"
        hx-post="{{ url_for('player_plan', code=game.code, color=player.color.key) }}"
        hx-target="#board"
        hx-indicator="#spinner">
        Plan Moves
    </button>
</div>
