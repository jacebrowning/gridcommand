{% extends 'base.html' %} {% block content %} {% if game %} {% include 'board.html' %}
{% else %}

<section class="gc-animate-in flex min-h-[85vh] flex-col justify-center">
    <div class="gc-panel relative mx-auto w-full max-w-xl overflow-hidden">
        <div
            class="gc-hero-grid pointer-events-none absolute inset-0 opacity-40"
            aria-hidden="true"
            style="
                background-image:
                    linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
                background-size: 22px 22px;
                mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
            "></div>

        <div class="relative space-y-6 sm:space-y-8">
            <div class="space-y-3">
                <h1 class="gc-title text-4xl sm:text-5xl md:text-6xl">Grid Command</h1>
                <p class="gc-sub max-w-md">
                    Plan every move at once. Reveal together. Hold the map.
                </p>
            </div>

            <div class="flex flex-row items-center justify-between gap-6 sm:gap-10">
                <a class="gc-btn-primary shrink-0" href="{{ url_for('create') }}">
                    New Game
                </a>

                <form
                    class="flex min-w-0 gap-2"
                    action="{{ url_for('create') }}"
                    method="post">
                    <input
                        type="text"
                        class="gc-input max-w-[6.5rem] uppercase sm:max-w-[10rem]"
                        placeholder="Code"
                        name="code"
                        autocomplete="off"
                        required />
                    <button class="gc-btn-secondary shrink-0" type="submit">
                        Join Game
                    </button>
                </form>
            </div>

            {% if error %}
            <p class="text-sm text-danger" role="alert">{{ error }}</p>
            {% endif %}
        </div>
    </div>
</section>

{% endif %} {% endblock %}
